version: '3.8'

# Fault: Disk space exhaustion due to unbounded log growth and temp file leaks
# RCA signals:
#   - backend logs: ENOSPC: no space left on device
#   - docker inspect <backend> → filesystem usage at 100%
#   - ls -lh /app/logs → audit.log growing continuously (100KB per request)
#   - ls -lh /app/temp → hundreds of temp_*.dat files never deleted (5MB each)
#   - df -h → container filesystem full
#   - Application stops accepting writes (POST fails with 500)
#   - Eventually cannot write any logs → complete lockup
#
# Root cause pattern: no log rotation strategy + temp files not cleaned up
# Disk fills silently until a critical write fails (DB operation, log append)
#
# How to run:
#   docker compose -f docker-compose.yml -f docker-compose.fault-disk-full.yml up --build
#   Send requests to fill disk:
#     for i in $(seq 1 100); do
#       curl -s -X POST http://localhost:5000/api/items \
#         -H 'Content-Type: application/json' \
#         -d "{\"name\":\"item$i\"}" > /dev/null
#     done
#   Watch disk usage:
#     docker exec <backend-container> df -h
#     docker exec <backend-container> du -sh /app/logs /app/temp

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.fault-disk-full
    environment:
      - MONGO_URI=mongodb://mongo:27017/mern-docker-deploy
      - PORT=5000
    # Limit storage size to accelerate disk full condition
    # Real scenario would be a persistent volume running out of space
    storage_opt:
      size: '500M'
    restart: always
